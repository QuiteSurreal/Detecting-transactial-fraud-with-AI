<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link href="../resources/style.css" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="../resources/loadTrain.js"></script>
  <link rel="icon" href="data:,">
  <title>Train New Model - Transaction Evaluator</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="index">Transaction evaluator</a>
        <ul class="nav navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="tasks">Previous tasks</a></li>
          <li class="nav-item"><a class="nav-link" href="stats">Statistics</a></li>
          <li class="nav-item active"><a class="nav-link" href="train">Train Model</a></li>
        </ul>
      </div>
    </nav>

    <div class="container" style="margin-top: 70px;">
      <h1>Train a New Model</h1>
      
      <div class="row mt-4">
        <div class="col-md-6">
          <h4>Model Name</h4>
          <input type="text" id="modelName" class="form-control mb-3" placeholder="e.g., XGB-V2, Ensemble-Tuned" required>
        </div>
        <div class="col-md-6">
          <h4>Select Base Model</h4>
          <select id="baseModel" class="form-control mb-3" required>
            <option value="">-- Select a model --</option>
            <option value="xgb">XGBoost</option>
            <option value="xgb_smote">XGBoost with SMOTE</option>
            <option value="ensemble">Ensemble (Random Forest + XGBoost)</option>
          </select>
        </div>
      </div>

      <div id="modelDescription" class="alert alert-info" style="display: none;"></div>

      <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>

      <h4 class="mt-4">Hyperparameters</h4>
      <div id="parametersContainer" class="row"></div>

      <div class="mt-4">
        <button id="trainButton" class="btn btn-primary" disabled>Start Training</button>
        <button id="resetButton" class="btn btn-secondary ms-2">Reset Form</button>
      </div>
    </div>
</body>
</html>
